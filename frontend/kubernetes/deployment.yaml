apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: <NAMESPACE>
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - env:
            - name: API_SERVER
              value: <API_SERVER>
            - name: SSL_CN
              value: <SSL_CN>
          image: <NAME>:<image-tag>
          imagePullPolicy: Always
          name: frontend
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
            - containerPort: 443
              name: https
              protocol: TCP
          volumeMounts:
            - name: frontend-tls
              mountPath: /etc/nginx/certs
              readOnly: true
      volumes:
        - name: frontend-tls
          secret:
            secretName: <TLS_SECRET_NAME>
            items:
              - key: <TLS_CERT_KEY>
                path: tls.crt
              - key: <TLS_KEY_KEY>
                path: tls.key
