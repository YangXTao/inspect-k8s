{{- $httpsEnabled := include "inspection-center.frontendHttpsEnabled" . -}}
{{- if and $httpsEnabled (not .Values.frontend.tls.existingSecret) -}}
{{- $env := .Values.frontend.env | default dict -}}
{{- $cn := (get $env "SSL_CN") | default "inspect.local" -}}
{{- $svcName := "frontend-nodeport" -}}
{{- $ns := .Release.Namespace -}}
{{- $dnsNames := list $cn $svcName (printf "%s.%s" $svcName $ns) (printf "%s.%s.svc" $svcName $ns) (printf "%s.%s.svc.cluster.local" $svcName $ns) -}}
{{- $cert := genSelfSignedCert $cn (list) $dnsNames 3650 -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "inspection-center.frontendTlsSecretName" . }}
  labels:
    app.kubernetes.io/name: {{ include "inspection-center.name" . }}
    app.kubernetes.io/component: frontend
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
data:
  {{ .Values.frontend.tls.certKey }}: {{ $cert.Cert | b64enc }}
  {{ .Values.frontend.tls.keyKey }}: {{ $cert.Key | b64enc }}
{{- end -}}
