{{- $httpsEnabled := include "inspection-center.frontendHttpsEnabled" . -}}
apiVersion: v1
kind: Service
metadata:
  name: frontend-nodeport
  labels:
    app.kubernetes.io/name: {{ include "inspection-center.name" . }}
    app.kubernetes.io/component: frontend
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.frontend.service.type | default "NodePort" }}
  selector:
    app.kubernetes.io/name: {{ include "inspection-center.name" . }}
    app.kubernetes.io/component: frontend
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.service.targetPort }}
      protocol: TCP
      {{- if .Values.frontend.service.nodePort }}
      nodePort: {{ .Values.frontend.service.nodePort }}
      {{- end }}
    {{- if $httpsEnabled }}
    - name: https
      port: {{ .Values.frontend.service.httpsPort | default 443 }}
      targetPort: {{ .Values.frontend.service.httpsTargetPort | default 443 }}
      protocol: TCP
      {{- if .Values.frontend.service.httpsNodePort }}
      nodePort: {{ .Values.frontend.service.httpsNodePort }}
      {{- end }}
    {{- end }}
