imagePullSecrets: []

serviceAccount:
  create: true
  name: ""

backend:
  replicaCount: 1
  image:
    repository: 192.168.10.51/inspect-k8s/backend
    tag: dev-v0.1.53
    pullPolicy: Always
  env:
    MYSQL_HOST: 192.168.10.184
    MYSQL_PORT: "3306"
    MYSQL_USER: root
    MYSQL_PASSWORD: root
    MYSQL_DATABASE: demo
    LICENSE_SECRET: demo-secret
  persistence:
    enabled: true
    create: true
    existingClaim: ""
    name: backend-data
    storageClassName: local-path
    size: 10Gi
    accessModes:
      - ReadWriteOnce
    mountPath: /app/data
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  nodeportService:
    enabled: true
    port: 8000
    targetPort: 8000
    nodePort: null
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

frontend:
  replicaCount: 1
  image:
    repository: 192.168.10.51/inspect-k8s/frontend
    tag: dev-v0.1.53
    pullPolicy: Always
  env:
    API_SERVER: http://backend:8000
    SSL_CN: inspect.local
  tls:
    existingSecret: ""
    certKey: tls.crt
    keyKey: tls.key
    mountPath: /etc/nginx/certs
  service:
    type: NodePort
    port: 80
    targetPort: 80
    nodePort: null
    httpsEnabled: true
    httpsPort: 443
    httpsTargetPort: 443
    httpsNodePort: null
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
