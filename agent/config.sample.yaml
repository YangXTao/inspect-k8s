server:
  base_url: http://backend:8000
  registration_token: "REPLACE_WITH_TOKEN"
  token_file: /app/state/agent.token
agent:
  name: demo-cluster
  poll_interval: 10
  batch_size: 1
  verify_ssl: false
  request_timeout: 15
cluster:
  # 留空则默认与 agent.name 保持一致
  name: ""
  # 在集群内运行时会自动使用 ServiceAccount 生成 kubeconfig
prometheus:
  base_url: http://prometheus:9090
