apiVersion: v1
kind: ServiceAccount
metadata:
  name: inspect-agent
  namespace: <NAMESPACE>
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: inspect-agent-readonly
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: inspect-agent-readonly
subjects:
  - kind: ServiceAccount
    name: inspect-agent
    namespace: <NAMESPACE>
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: inspect-agent-readonly
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: inspect-agent-config
  namespace: <NAMESPACE>
data:
  config.yaml: |
    server:
      base_url: http://backend:8000
      token_file: /var/lib/inspect-agent/agent.token
    agent:
      poll_interval: 10
      batch_size: 1
      verify_ssl: false
      request_timeout: 15
      status_report_interval: 60
    cluster:
      name: demo-cluster
    prometheus:
      base_url: http://prometheus.monitoring:9090
---
apiVersion: v1
kind: Secret
metadata:
  name: inspect-agent-secret
  namespace: <NAMESPACE>
type: Opaque
stringData:
  registration_token: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inspect-agent
  namespace: <NAMESPACE>
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inspect-agent
  template:
    metadata:
      labels:
        app: inspect-agent
    spec:
      serviceAccountName: inspect-agent
      volumes:
        - name: config
          configMap:
            name: inspect-agent-config
        - name: state
          emptyDir: {}
      containers:
        - name: inspect-agent
          image: <NAME>:<image-tag>
          imagePullPolicy: IfNotPresent
          env:
            - name: INSPECT_AGENT_CONFIG
              value: /app/config/config.yaml
            - name: INSPECT_AGENT_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: inspect-agent-secret
                  key: registration_token
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: state
              mountPath: /var/lib/inspect-agent
